spring.application.name=lumina-backend
# Configurações do Banco de Dados H2 (Roda em memória)
spring.datasource.url=jdbc:h2:mem:luminadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ativa o console do H2 no navegador para podermos ver as tabelas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualiza a estrutura do banco automaticamente com base nas classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true